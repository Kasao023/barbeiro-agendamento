<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Notificações - Seu Jorge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #0a0a0a; color: #fff; padding: 50px 20px; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1 class="mb-4"><i class="bi bi-bell"></i> Teste de Notificações</h1>
        
        <div class="card bg-secondary p-4 mb-4">
            <h5>Status do Sistema</h5>
            <p id="status" class="mb-0">Verificando...</p>
        </div>
        
        <div class="d-grid gap-3">
            <button class="btn btn-danger btn-lg" onclick="ativar()">
                <i class="bi bi-bell"></i> Ativar Notificações
            </button>
            <button class="btn btn-outline-light btn-lg" onclick="testar()">
                <i class="bi bi-send"></i> Enviar Notificação de Teste
            </button>
            <button class="btn btn-outline-info" onclick="verificarToken()">
                <i class="bi bi-key"></i> Ver Token FCM
            </button>
        </div>

        <div class="card bg-secondary p-3 mt-4">
            <h6>Instruções</h6>
            <ol class="small mb-0">
                <li>Clique em <strong>"Ativar Notificações"</strong></li>
                <li>O navegador vai pedir permissão — clique em <strong>"Permitir"</strong></li>
                <li>Clique em <strong>"Enviar Notificação de Teste"</strong> para ver funcionando</li>
                <li>O token FCM será salvo no Firebase automaticamente</li>
            </ol>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    <script src="notifications.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBg2LvzNxheXfb_78I9BIqn60DqNAoTLgw",
            authDomain: "seu-jorge-barbearia.firebaseapp.com",
            databaseURL: "https://seu-jorge-barbearia-default-rtdb.firebaseio.com",
            projectId: "seu-jorge-barbearia",
            storageBucket: "seu-jorge-barbearia.firebasestorage.app",
            messagingSenderId: "941746252187",
            appId: "1:941746252187:web:4a3a79dd1d6a8d5967993e"
        };
        firebase.initializeApp(firebaseConfig);

        function atualizarStatus() {
            const status = Notificacoes.statusPermissao();
            const el = document.getElementById('status');
            const textos = {
                'granted': '✅ Notificações ativadas e funcionando!',
                'denied': '❌ Notificações bloqueadas. Ative nas configurações do navegador.',
                'default': '⚠️ Permissão pendente. Clique em "Ativar Notificações".',
                'nao_suportado': '⚠️ Este navegador não suporta notificações.'
            };
            const cores = {
                'granted': 'text-success',
                'denied': 'text-danger',
                'default': 'text-warning',
                'nao_suportado': 'text-muted'
            };
            el.textContent = textos[status];
            el.className = 'mb-0 ' + (cores[status] || '');
        }

        async function ativar() {
            const sucesso = await Notificacoes.inicializarNotificacoes('teste');
            if (sucesso) {
                alert('✅ Notificações ativadas!');
            } else {
                alert('❌ Não foi possível ativar. Verifique as permissões.');
            }
            atualizarStatus();
        }

        function testar() {
            Notificacoes.exibirNotificacaoLocal(
                '🔔 Teste de Notificação',
                'Se você está vendo isso, as notificações estão funcionando perfeitamente!',
                'seujorge.png'
            );
        }

        async function verificarToken() {
            const token = await Notificacoes.obterTokenNotificacao();
            if (token) {
                alert('Token FCM:\n\n' + token);
            } else {
                alert('Nenhum token disponível. Ative as notificações primeiro.');
            }
        }

        document.addEventListener('DOMContentLoaded', atualizarStatus);
    </script>
</body>
</html>

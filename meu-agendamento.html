<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Agendamento | Seu Jorge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a !important; color: #fff; padding-top: 0 !important; }
        .topo { background: #0a0a0a; border-bottom: 3px solid var(--cor-primaria); padding: 15px 0; }
        .topo .navbar-brand { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; font-size: 1.6rem; }
        .card-ver { background: #fff; color: #333; border-radius: 15px; padding: 25px; border-top: 5px solid var(--cor-primaria); }
        .linha { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #ddd; }
        .linha:last-of-type { border-bottom: none; }
        .label { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .valor { font-weight: 600; text-align: right; }
        .status { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }
        .status-pendente { background: #fff3cd; color: #856404; }
        .status-concluido { background: #d4edda; color: #155724; }
        .status-cancelado { background: #f8d7da; color: #721c24; }
        .btn-cancelar { background: #dc3545; border: none; color: #fff; font-weight: 700; letter-spacing: 1px; padding: 12px; border-radius: 10px; text-transform: uppercase; }
        .btn-cancelar:hover { background: #a71d2a; color: #fff; }
        .btn-voltar { border: 2px solid var(--cor-dourada); color: var(--cor-dourada); font-weight: 700; letter-spacing: 1px; padding: 12px; border-radius: 10px; text-transform: uppercase; }
        .btn-voltar:hover { background: var(--cor-dourada); color: #000; }
    </style>
</head>
<body>

    <div class="topo">
        <div class="container text-center">
            <span class="navbar-brand text-white"><i class="bi bi-scissors text-danger"></i> SEU JORGE</span>
        </div>
    </div>

    <div class="container py-5" style="max-width: 600px;">
        <h2 class="text-center mb-4" style="font-family:'Bebas Neue',sans-serif; letter-spacing:3px; color: var(--cor-dourada);">
            MEU AGENDAMENTO
        </h2>

        <div id="conteudo">
            <p class="text-center text-muted">Carregando...</p>
        </div>

        <div class="text-center mt-4">
            <a href="index.html" class="btn btn-voltar">
                <i class="bi bi-arrow-left"></i> Voltar ao site
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBg2LvzNxheXfb_78I9BIqn60DqNAoTLgw",
            authDomain: "seu-jorge-barbearia.firebaseapp.com",
            databaseURL: "https://seu-jorge-barbearia-default-rtdb.firebaseio.com",
            projectId: "seu-jorge-barbearia",
            storageBucket: "seu-jorge-barbearia.firebasestorage.app",
            messagingSenderId: "941746252187",
            appId: "1:941746252187:web:4a3a79dd1d6a8d5967993e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const params = new URLSearchParams(location.search);
        const id = params.get('id') || localStorage.getItem('ultimoAgendamento');
        const conteudo = document.getElementById('conteudo');

        if (!id) {
            conteudo.innerHTML = `
                <div class="card-ver text-center">
                    <i class="bi bi-calendar-x display-4 text-muted"></i>
                    <p class="mt-3 mb-2">Nenhum agendamento encontrado.</p>
                    <p class="small text-muted">Se você já agendou, verifique o link que recebeu no WhatsApp.</p>
                    <a href="index.html#agendar" class="btn btn-danger mt-3 fw-bold">Fazer um agendamento</a>
                </div>`;
        } else {
            db.ref('agendamentos/' + id).on('value', snap => {
                const ag = snap.val();

                if (!ag) {
                    conteudo.innerHTML = `
                        <div class="card-ver text-center">
                            <i class="bi bi-x-circle display-4 text-danger"></i>
                            <p class="mt-3 mb-2">Este agendamento não existe mais ou foi cancelado.</p>
                            <a href="index.html#agendar" class="btn btn-danger mt-3 fw-bold">Fazer novo agendamento</a>
                        </div>`;
                    localStorage.removeItem('ultimoAgendamento');
                    return;
                }

                const status = (ag.status || 'pendente').toLowerCase();
                const statusLabel = status === 'concluido' ? 'Concluído'
                                  : status === 'cancelado' ? 'Cancelado'
                                  : 'Pendente';
                const statusClass = 'status-' + status;

                const dataFmt = new Date(ag.data + 'T00:00:00').toLocaleDateString('pt-BR', {
                    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                });

                const preco = typeof ag.servicoPreco === 'number'
                    ? 'R$ ' + ag.servicoPreco.toFixed(2).replace('.', ',')
                    : '-';

                conteudo.innerHTML = `
                    <div class="card-ver">
                        <div class="text-center mb-4">
                            <span class="status ${statusClass}">${statusLabel}</span>
                        </div>

                        <div class="linha">
                            <span class="label">Nome</span>
                            <span class="valor">${ag.clienteNome || '-'}</span>
                        </div>
                        <div class="linha">
                            <span class="label">Serviço</span>
                            <span class="valor">${ag.servicoNome || '-'}</span>
                        </div>
                        <div class="linha">
                            <span class="label">Data</span>
                            <span class="valor">${dataFmt}</span>
                        </div>
                        <div class="linha">
                            <span class="label">Horário</span>
                            <span class="valor">${ag.horario || '-'}</span>
                        </div>
                        <div class="linha">
                            <span class="label">Valor</span>
                            <span class="valor">${preco}</span>
                        </div>
                        ${ag.observacoes ? `
                        <div class="linha">
                            <span class="label">Observações</span>
                            <span class="valor" style="max-width:60%; font-weight:400; font-size:0.9rem;">${ag.observacoes}</span>
                        </div>` : ''}

                        <div id="area-cancelar" class="mt-4"></div>
                    </div>
                `;

                const area = document.getElementById('area-cancelar');

                if (status === 'cancelado') {
                    area.innerHTML = `<p class="text-center text-muted small mb-0">Este agendamento foi cancelado.</p>`;
                } else if (status === 'concluido') {
                    area.innerHTML = `<p class="text-center text-success small mb-0"><i class="bi bi-check-circle"></i> Atendimento concluído. Obrigado!</p>`;
                } else {
                    area.innerHTML = `<button id="btnCancelar" class="btn btn-cancelar w-100">
                        <i class="bi bi-x-circle"></i> Cancelar agendamento
                    </button>`;
                    document.getElementById('btnCancelar').addEventListener('click', () => {
                        if (confirm('Tem certeza que deseja cancelar seu agendamento?')) {
                            db.ref('agendamentos/' + id).remove()
                                .then(() => {
                                    localStorage.removeItem('ultimoAgendamento');
                                    alert('Agendamento cancelado. O horário foi liberado.');
                                    location.reload();
                                })
                                .catch(err => {
                                    console.error(err);
                                    alert('Erro ao cancelar. Tente novamente ou chame no WhatsApp.');
                                });
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>

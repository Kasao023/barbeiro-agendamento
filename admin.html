<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Seu Jorge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a !important; color: #fff; padding-top: 0 !important; }
        .nav-pills .nav-link { color: #fff; border-radius: 10px; }
        .nav-pills .nav-link.active { background: var(--cor-primaria); }
        .agendamento-card {
            background: #fff; color: #333; border-radius: 10px; padding: 15px;
            margin-bottom: 10px; border-left: 4px solid var(--cor-primaria);
        }
        .agendamento-card.concluido { border-left-color: var(--cor-sucesso); opacity: 0.7; }
        .agendamento-card.cancelado { border-left-color: #6c757d; opacity: 0.5; text-decoration: line-through; }
        .servico-admin-card {
            background: #fff; color: #333; border-radius: 10px; padding: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .card { color: #333; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="tela-login" class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
            <div class="text-center mb-4">
                <i class="bi bi-scissors display-4 text-danger"></i>
                <h3 class="mt-3 fw-bold">PAINEL DO JORGE</h3>
                <p class="text-muted small">Área restrita</p>
            </div>
            <input type="password" id="senha-input" class="form-control mb-3" placeholder="Senha"
                   onkeypress="if(event.key==='Enter') fazerLogin()">
            <button class="btn btn-danger btn-lg fw-bold" onclick="fazerLogin()">
                <i class="bi bi-box-arrow-in-right"></i> ENTRAR
            </button>
            <p id="login-erro" class="text-danger small text-center mt-2"></p>
        </div>
    </div>

    <!-- PAINEL -->
    <div id="tela-painel" style="display: none;">
        <nav class="navbar navbar-dark bg-black border-bottom border-danger">
            <div class="container">
                <span class="navbar-brand fw-bold"><i class="bi bi-scissors"></i> PAINEL</span>
                <button class="btn btn-outline-light btn-sm" onclick="fazerLogout()">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </nav>

        <div class="container py-4">
            <ul class="nav nav-pills mb-4">
                <li class="nav-item"><a class="nav-link active" data-bs-toggle="pill" href="#aba-agendamentos">📅 Agendamentos</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="pill" href="#aba-servicos">✂️ Serviços</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="pill" href="#aba-bloqueios">🚫 Bloqueios</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="pill" href="#aba-config">⚙️ Config</a></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="aba-agendamentos">
                    <h4 class="text-white mb-3">📅 Agendamentos</h4>
                    <div id="lista-agendamentos"></div>
                </div>

                <div class="tab-pane fade" id="aba-servicos">
                    <h4 class="text-white mb-3">✂️ Serviços</h4>
                    <div id="lista-servicos"></div>
                    <button class="btn btn-danger mt-3" onclick="adicionarServico()">
                        <i class="bi bi-plus-circle"></i> Adicionar Serviço
                    </button>
                </div>

                <div class="tab-pane fade" id="aba-bloqueios">
                    <h4 class="text-white mb-3">🚫 Bloquear Horários</h4>
                    <p class="text-muted small">Bloqueie horários que você não vai atender.</p>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label text-white">Data</label>
                            <input type="date" id="bloqueio-data" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-white">Horário</label>
                            <input type="time" id="bloqueio-hora" class="form-control" step="1800">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button class="btn btn-danger w-100" onclick="bloquearHorario()">
                                <i class="bi bi-lock"></i> Bloquear
                            </button>
                        </div>
                    </div>
                    <div id="lista-bloqueios" class="mt-4"></div>
                </div>

                <div class="tab-pane fade" id="aba-config">
                    <h4 class="text-white mb-3">⚙️ Configurações</h4>
                    <div class="card p-3 mb-3">
                        <label class="form-label">Alterar Senha</label>
                        <input type="password" id="nova-senha" class="form-control mb-2" placeholder="Nova senha">
                        <button class="btn btn-danger" onclick="alterarSenha()">Salvar Nova Senha</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL SERVIÇO -->
    <div class="modal fade" id="modalServico" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Serviço</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-servico-id">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" id="edit-servico-nome" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Duração (minutos)</label>
                        <input type="number" id="edit-servico-duracao" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preço (R$)</label>
                        <input type="number" id="edit-servico-preco" class="form-control" step="0.01">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-danger" onclick="salvarServico()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP + FIREBASE -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- TUDO INLINE -->
    <script>
    (function() {
        'use strict';

        const firebaseConfig = {
            apiKey: "AIzaSyBg2LvzNxheXfb_78I9BIqn60DqNAoTLgw",
            authDomain: "seu-jorge-barbearia.firebaseapp.com",
            databaseURL: "https://seu-jorge-barbearia-default-rtdb.firebaseio.com",
            projectId: "seu-jorge-barbearia",
            storageBucket: "seu-jorge-barbearia.firebasestorage.app",
            messagingSenderId: "941746252187",
            appId: "1:941746252187:web:4a3a79dd1d6a8d5967993e"
        };

        let db = null;
        let servicos = [];
        let agendamentos = [];

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) {
            console.error('❌ Falha ao inicializar Firebase:', e);
        }

        // ============ LOGIN ============
        window.fazerLogin = function() {
            const input = document.getElementById('senha-input');
            const erroEl = document.getElementById('login-erro');
            const senha = (input.value || '').trim();

            erroEl.textContent = '';

            if (!db) {
                erroEl.textContent = 'Erro: Firebase não carregou.';
                return;
            }

            db.ref('config/admin/senha').once('value')
                .then(snap => {
                    const senhaBanco = snap.val();
                    const senhaCorreta = (senhaBanco || 'jorge2026').toString().trim();

                    if (senha === senhaCorreta) {
                        sessionStorage.setItem('logado', 'true');
                        window.abrirPainel();
                    } else {
                        erroEl.textContent = 'Senha incorreta!';
                    }
                })
                .catch(err => {
                    console.error('❌ Erro Firebase:', err);
                    erroEl.textContent = 'Erro de conexão.';
                });
        };

        window.fazerLogout = function() {
            sessionStorage.removeItem('logado');
            location.reload();
        };

        window.abrirPainel = function() {
            const elLogin = document.getElementById('tela-login');
            const elPainel = document.getElementById('tela-painel');

            if (!elLogin || !elPainel) {
                console.error('❌ Elementos não existem');
                return;
            }

            elLogin.style.setProperty('display', 'none', 'important');
            elPainel.style.display = 'block';

            carregarTudo();
        };

        // ============ CARREGAR ============
        function carregarTudo() {
            if (!db) return;

            db.ref('config/servicos').on('value', snap => {
                try {
                    servicos = [];
                    snap.forEach(c => servicos.push({ id: c.key, ...c.val() }));
                    renderizarServicos();
                } catch (e) { console.error('❌ serviços:', e); }
            });

            db.ref('agendamentos').on('value', snap => {
                try {
                    agendamentos = [];
                    snap.forEach(c => {
                        agendamentos.push({ id: c.key, ...c.val() });
                    });
                    renderizarAgendamentos();
                } catch (e) { console.error('❌ agendamentos:', e); }
            });

            db.ref('bloqueios').on('value', snap => {
                try {
                    renderizarBloqueios(snap.val() || {});
                } catch (e) { console.error('❌ bloqueios:', e); }
            });
        }

        // ============ AGENDAMENTOS ============
        function renderizarAgendamentos() {
            const container = document.getElementById('lista-agendamentos');
            if (!container) return;

            const hojeStr = new Date().toISOString().split('T')[0];

            const hoje = agendamentos.filter(a => a.data === hojeStr)
                .sort((a, b) => (a.horario || '').localeCompare(b.horario || ''));
            const futuros = agendamentos.filter(a => a.data > hojeStr)
                .sort((a, b) => ((a.data || '') + (a.horario || '')).localeCompare((b.data || '') + (b.horario || '')));

            if (hoje.length === 0 && futuros.length === 0) {
                container.innerHTML = '<p class="text-muted">Nenhum agendamento futuro.</p>';
                return;
            }

            let html = '';
            let erros = 0;

            if (hoje.length > 0) {
                html += `<h5 class="text-warning mb-3 mt-2"><i class="bi bi-fire"></i> HOJE (${hoje.length})</h5>`;
                hoje.forEach(ag => {
                    try {
                        html += montarCard(ag, true);
                    } catch (e) {
                        erros++;
                        console.error('❌ Erro ao montar card HOJE:', ag, e);
                    }
                });
            }
            if (futuros.length > 0) {
                html += `<h5 class="text-white mb-3 mt-4"><i class="bi bi-calendar-week"></i> PRÓXIMOS (${futuros.length})</h5>`;
                futuros.forEach(ag => {
                    try {
                        html += montarCard(ag, false);
                    } catch (e) {
                        erros++;
                        console.error('❌ Erro ao montar card FUTUROS:', ag, e);
                    }
                });
            }

            container.innerHTML = html;
        }

        function montarCard(ag, ehHoje) {
            const dataFmt = new Date(ag.data + 'T00:00:00').toLocaleDateString('pt-BR');
            const classe = ag.status === 'concluido' ? 'concluido' : (ag.status === 'cancelado' ? 'cancelado' : '');
            const tel = (ag.clienteTelefone || '').replace(/\D/g, '');
            const preco = typeof ag.servicoPreco === 'number' ? ag.servicoPreco.toFixed(2).replace('.', ',') : '-';
            const badge = ag.status === 'concluido' ? 'success' : ag.status === 'cancelado' ? 'secondary' : 'warning';

            return `
                <div class="agendamento-card ${classe}" ${ehHoje ? 'style="border-left-color:#ffc107;"' : ''}>
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1"><strong>${ag.horario || '--:--'}</strong> — ${ag.clienteNome || 'Sem nome'}</h6>
                            <p class="mb-1 small">📅 ${dataFmt}</p>
                            <p class="mb-1 small">💈 ${ag.servicoNome || '-'} — R$ ${preco}</p>
                            <p class="mb-1 small">📞 ${ag.clienteTelefone || '-'}</p>
                            ${ag.observacoes ? `<p class="mb-0 small text-muted">📝 ${ag.observacoes}</p>` : ''}
                            <span class="badge bg-${badge} mt-1">${ag.status || 'pendente'}</span>
                        </div>
                        <div class="d-flex gap-1 flex-wrap justify-content-end">
                            <button class="btn btn-sm btn-warning" onclick="lembrarCliente('${ag.id}')" title="Lembrar">
                                <i class="bi bi-bell"></i>
                            </button>
                            <a href="https://wa.me/55${tel}" target="_blank" class="btn btn-sm btn-success">
                                <i class="bi bi-whatsapp"></i>
                            </a>
                            <button class="btn btn-sm btn-primary" onclick="mudarStatus('${ag.id}', 'concluido')">
                                <i class="bi bi-check"></i>
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="mudarStatus('${ag.id}', 'cancelado')">
                                <i class="bi bi-x"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="excluirAgendamento('${ag.id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.mudarStatus = function(id, status) {
            db.ref('agendamentos/' + id + '/status').set(status);
        };

        window.excluirAgendamento = function(id) {
            if (confirm('Excluir este agendamento?')) {
                db.ref('agendamentos/' + id).remove();
            }
        };

        window.lembrarCliente = function(id) {
            const ag = agendamentos.find(a => a.id === id);
            if (!ag) return;
            const tel = (ag.clienteTelefone || '').replace(/\D/g, '');
            if (!tel) { alert('Sem telefone cadastrado.'); return; }
            const primeiro = (ag.clienteNome || '').split(' ')[0] || 'tudo bem';
            const dataFmt = new Date(ag.data + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            const msg = `Fala ${primeiro}! Passando pra confirmar seu horário: ${dataFmt} às ${ag.horario}, serviço ${ag.servicoNome}. Tá confirmado? 💈`;
            window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        // ============ SERVIÇOS ============
        function renderizarServicos() {
            const container = document.getElementById('lista-servicos');
            if (!container) return;
            let html = '';
            servicos.forEach(s => {
                const preco = typeof s.preco === 'number' ? s.preco.toFixed(2).replace('.', ',') : '-';
                html += `
                    <div class="servico-admin-card">
                        <div>
                            <h6 class="mb-0">${s.nome || '-'}</h6>
                            <small>${s.duracao || '-'} min - R$ ${preco}</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-primary" onclick="editarServico('${s.id}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="excluirServico('${s.id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.editarServico = function(id) {
            const s = servicos.find(sv => sv.id === id);
            if (!s) return;
            document.getElementById('edit-servico-id').value = id;
            document.getElementById('edit-servico-nome').value = s.nome || '';
            document.getElementById('edit-servico-duracao').value = s.duracao || 30;
            document.getElementById('edit-servico-preco').value = s.preco || 0;
            new bootstrap.Modal(document.getElementById('modalServico')).show();
        };

        window.salvarServico = function() {
            const id = document.getElementById('edit-servico-id').value;
            const dados = {
                nome: document.getElementById('edit-servico-nome').value.toUpperCase(),
                duracao: parseInt(document.getElementById('edit-servico-duracao').value) || 30,
                preco: parseFloat(document.getElementById('edit-servico-preco').value) || 0,
                icone: 'bi-scissors',
                ativo: true
            };
            db.ref('config/servicos/' + id).update(dados);
            bootstrap.Modal.getInstance(document.getElementById('modalServico')).hide();
        };

        window.adicionarServico = function() {
            const id = 's' + Date.now();
            db.ref('config/servicos/' + id).set({
                nome: 'NOVO SERVIÇO', duracao: 30, preco: 0,
                icone: 'bi-scissors', ativo: true
            });
        };

        window.excluirServico = function(id) {
            if (confirm('Excluir este serviço?')) db.ref('config/servicos/' + id).remove();
        };

        // ============ BLOQUEIOS ============
        window.bloquearHorario = function() {
            const data = document.getElementById('bloqueio-data').value;
            const hora = document.getElementById('bloqueio-hora').value;
            if (!data || !hora) { alert('Preencha data e hora!'); return; }
            db.ref('bloqueios/' + data + '/' + hora).set(true).then(() => {
                alert('Horário bloqueado!');
                document.getElementById('bloqueio-data').value = '';
                document.getElementById('bloqueio-hora').value = '';
            });
        };

        function renderizarBloqueios(bloqueios) {
            const container = document.getElementById('lista-bloqueios');
            if (!container) return;
            let html = '<h6 class="text-white">Horários bloqueados:</h6>';
            const datas = Object.keys(bloqueios).sort();
            if (datas.length === 0) {
                html += '<p class="text-muted small">Nenhum horário bloqueado.</p>';
            } else {
                datas.forEach(data => {
                    const horas = Object.keys(bloqueios[data]);
                    if (horas.length === 0) return;
                    const dataFmt = new Date(data + 'T00:00:00').toLocaleDateString('pt-BR');
                    html += `<div class="agendamento-card"><strong>${dataFmt}</strong><div class="d-flex gap-1 flex-wrap mt-2">`;
                    horas.forEach(hora => {
                        html += `<button class="btn btn-sm btn-outline-danger" onclick="desbloquear('${data}', '${hora}')">${hora} ✕</button>`;
                    });
                    html += `</div></div>`;
                });
            }
            container.innerHTML = html;
        }

        window.desbloquear = function(data, hora) {
            db.ref('bloqueios/' + data + '/' + hora).remove();
        };

        // ============ SENHA ============
        window.alterarSenha = function() {
            const nova = document.getElementById('nova-senha').value;
            if (!nova || nova.length < 4) {
                alert('A senha precisa ter pelo menos 4 caracteres.');
                return;
            }
            db.ref('config/admin/senha').set(nova.trim()).then(() => {
                alert('Senha alterada com sucesso!');
                document.getElementById('nova-senha').value = '';
            });
        };

        // ============ INICIALIZAÇÃO ============
        if (sessionStorage.getItem('logado') === 'true') {
            window.abrirPainel();
        }
    })();
    </script>
</body>
</html>
